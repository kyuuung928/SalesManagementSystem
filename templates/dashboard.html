{% extends 'base.html' %}
{% block content %}
<div class="top-header">
    <div class="page-title">DashBoard</div>
    <div class="gear-icon" onclick="openSettingsModal()">⚙️</div>
</div>

<div class="gauge-section">
    <!-- 왼쪽 게이지 (합산 전체) -->
    <div class="gauge-group">
        <h3>[전체] 목표대비 실적</h3>
        <div class="gauge-container">
            <div class="gauge-box">
                <div style="height: 120px; width: 100%;"><canvas id="gauge-rev"></canvas></div>
                <div style="font-size:0.85rem; color:var(--text-muted);">목표대비 매출</div>
                <div id="rev-pct-text" style="font-size:1.2rem; font-weight:bold; color:var(--blue-accent);">0%</div>
            </div>
            <div class="gauge-box">
                <div style="height: 120px; width: 100%;"><canvas id="gauge-gp"></canvas></div>
                <div style="font-size:0.85rem; color:var(--text-muted);">목표대비 GP</div>
                <div id="gp-pct-text" style="font-size:1.2rem; font-weight:bold; color:var(--blue-accent);">0%</div>
            </div>
        </div>
    </div>

    <!-- 오른쪽 게이지 (수주 100%) -->
    <div class="gauge-group">
        <h3>[수주 100%] 목표대비 실적</h3>
        <div class="gauge-container">
            <div class="gauge-box">
                <div style="height: 120px; width: 100%;"><canvas id="gauge-rev-100"></canvas></div>
                <div style="font-size:0.85rem; color:var(--text-muted);">(수주100%) 목표대비 매출</div>
                <div id="rev-100-pct-text" style="font-size:1.2rem; font-weight:bold; color:var(--blue-accent);">0%</div>
            </div>
            <div class="gauge-box">
                <div style="height: 120px; width: 100%;"><canvas id="gauge-gp-100"></canvas></div>
                <div style="font-size:0.85rem; color:var(--text-muted);">(수주100%) 목표대비 GP</div>
                <div id="gp-100-pct-text" style="font-size:1.2rem; font-weight:bold; color:var(--blue-accent);">0%</div>
            </div>
        </div>
    </div>
</div>

<!-- 총계 카드 -->
<div class="summary-cards">
    <div class="card">
        <h4>총 건수</h4>
        <div class="value" id="total-count">0 건</div>
    </div>
    <div class="card">
        <h4>총 매출</h4>
        <div class="value" id="total-revenue">0 원</div>
    </div>
    <div class="card">
        <h4>총 GP</h4>
        <div class="value" id="total-gp">0 원</div>
    </div>
</div>

<!-- 팀별 현황 표 -->
<table class="team-summary-table">
    <thead>
        <tr>
            <th>구분</th>
            <th>총 건수</th>
            <th>총 매출</th>
            <th>총 GP</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td><strong>커머셜팀</strong></td>
            <td id="comm-count">0 건</td>
            <td id="comm-revenue">0 원</td>
            <td id="comm-gp">0 원</td>
        </tr>
        <tr>
            <td><strong>서비스영업팀</strong></td>
            <td id="serv-count">0 건</td>
            <td id="serv-revenue">0 원</td>
            <td id="serv-gp">0 원</td>
        </tr>
    </tbody>
</table>

<!-- Settings Modal -->
<div id="settings-modal" class="modal">
    <div class="modal-content">
        <h3>목표치 설정</h3>
        <div class="form-group">
            <label>목표 매출</label>
            <input type="text" id="target-rev-input" oninput="formatNumberInput(this)">
        </div>
        <div class="form-group">
            <label>목표 GP</label>
            <input type="text" id="target-gp-input" oninput="formatNumberInput(this)">
        </div>
        <div class="modal-btns">
            <button class="btn" onclick="closeSettingsModal()">취소</button>
            <button class="btn btn-blue" onclick="saveSettings()">저장</button>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
