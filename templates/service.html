{% extends 'base.html' %}
{% block content %}
<div class="top-header">
    <div class="page-title">{{ team_name }}</div>
</div>

<!-- 팀 목표 달성률 게이지 -->
<div class="gauge-section" style="display: flex; gap: 20px; margin-bottom: 20px;">
    <div class="gauge-group" style="flex: 1; background: #1e293b; padding: 15px; border-radius: 8px;">
        <h4 style="text-align: center; margin-bottom: 10px;">[서비스영업팀] 예상 목표 달성률</h4>
        <div class="gauge-container" style="display: flex; justify-content: space-around;">
            <div class="gauge-box" style="text-align: center;">
                <div style="height: 100px; width: 130px;"><canvas id="team-gauge-rev"></canvas></div>
                <div style="font-size:0.85rem; color:#94a3b8;">목표대비 매출</div>
                <div id="team-rev-pct-text" style="font-size:1.1rem; font-weight:bold; color:#38bdf8;">0%</div>
            </div>
            <div class="gauge-box" style="text-align: center;">
                <div style="height: 100px; width: 130px;"><canvas id="team-gauge-gp"></canvas></div>
                <div style="font-size:0.85rem; color:#94a3b8;">목표대비 GP</div>
                <div id="team-gp-pct-text" style="font-size:1.1rem; font-weight:bold; color:#38bdf8;">0%</div>
            </div>
        </div>
    </div>
    <div class="gauge-group" style="flex: 1; background: #1e293b; padding: 15px; border-radius: 8px;">
        <h4 style="text-align: center; margin-bottom: 10px;">[서비스영업팀] 확정 목표 달성률</h4>
        <div class="gauge-container" style="display: flex; justify-content: space-around;">
            <div class="gauge-box" style="text-align: center;">
                <div style="height: 100px; width: 130px;"><canvas id="team-gauge-rev-100"></canvas></div>
                <div style="font-size:0.85rem; color:#94a3b8;">목표대비 매출</div>
                <div id="team-rev-100-pct-text" style="font-size:1.1rem; font-weight:bold; color:#38bdf8;">0%</div>
            </div>
            <div class="gauge-box" style="text-align: center;">
                <div style="height: 100px; width: 130px;"><canvas id="team-gauge-gp-100"></canvas></div>
                <div style="font-size:0.85rem; color:#94a3b8;">목표대비 GP</div>
                <div id="team-gp-100-pct-text" style="font-size:1.1rem; font-weight:bold; color:#38bdf8;">0%</div>
            </div>
        </div>
    </div>
</div>

<!-- 카드 요약 -->
<div class="summary-cards">
    <div class="card">
        <h4>총 건수</h4>
        <div class="value" id="sum-count">0 건</div>
    </div>
    <div class="card">
        <h4>총 매출</h4>
        <div class="value" id="sum-revenue">0 원</div>
    </div>
    <div class="card">
        <h4>총 GP</h4>
        <div class="value" id="sum-gp">0 원</div>
    </div>
</div>

<!-- 검색 및 버튼 -->
<div class="controls-bar">
    <div class="search-box">
        <input type="text" id="search-input" placeholder="사업명 또는 영업대표 검색..." onkeyup="searchDeals()">
    </div>
    <div class="action-btns">
        <button class="btn btn-blue" onclick="openAddModal()">+</button>
        <button class="btn btn-yellow" onclick="openEditModal()">수정</button>
        <button class="btn btn-red" onclick="deleteDeal()">삭제</button>
    </div>
</div>

<!-- 테이블 -->
<table class="data-table">
    <thead>
        <tr>
            <th style="width: 50px;">No</th>
            <th>사업명</th>
            <th>수주확률</th>
            <th>매출</th>
            <th>GP</th>
            <th>영업대표</th>
            <th>수주시기</th>
        </tr>
    </thead>
    <tbody id="deal-table-body">
    </tbody>
</table>

<!-- 등록/수정 모달 -->
<div id="deal-modal" class="modal">
    <div class="modal-content">
        <h3 id="modal-title">사업 등록</h3>
        <form id="deal-form" onsubmit="event.preventDefault(); saveDeal();">
            <input type="hidden" id="deal-id">
            <div class="form-group">
                <label>사업명</label>
                <input type="text" id="deal-title" required>
            </div>
            <div class="form-group">
                <label>수주확률 (%)</label>
                <select id="deal-prob" required>
                    <option value="0">0%</option>
                    <option value="25">25%</option>
                    <option value="50">50%</option>
                    <option value="75">75%</option>
                    <option value="100">100%</option>
                </select>
            </div>
            <div class="form-group">
                <label>매출</label>
                <input type="text" id="deal-rev" oninput="formatNumberInput(this)" required>
            </div>
            <div class="form-group">
                <label>GP</label>
                <input type="text" id="deal-gp" oninput="formatNumberInput(this)" required>
            </div>
            <div class="form-group">
                <label>영업대표</label>
                <input type="text" id="deal-rep" required>
            </div>
            <div class="form-group">
                <label>수주시기</label>
                <input type="month" id="deal-month" required>
            </div>
            <div class="form-group">
                <label>메모</label>
                <textarea id="deal-memo" rows="3"></textarea>
            </div>
            <div class="modal-btns">
                <button type="button" class="btn" onclick="closeDealModal()">취소</button>
                <button type="submit" class="btn btn-blue">저장</button>
            </div>
        </form>
    </div>
</div>

<script src="{{ url_for('static', filename='js/team.js') }}"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        initTeamPage('서비스영업팀');
    });
</script>
{% endblock %}
